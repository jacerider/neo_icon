neo.icon.data:
  path: '/api/icons/{libraries}'
  defaults:
    _controller: '\Drupal\neo_icon\Controller\IconBrowserController::data'
    _title: 'Icon Libraries Data'
    libraries: ''
  requirements:
    _access: 'TRUE'

neo.icon.all:
  path: '/admin/config/neo/icon/all'
  defaults:
    _controller: '\Drupal\neo_icon\Controller\IconBrowserController::all'
    _title: 'Icon Browser'
    libraries: ''
  requirements:
    _permission: 'administer neo_icon'

neo.icon.entity:
  path: '/admin/config/neo/icons/entity'
  defaults:
    _form: '\Drupal\neo_icon\Form\IconEntityForm'
    _title: 'Entity Type Icons'
  requirements:
    _permission: 'administer neo_icon'
