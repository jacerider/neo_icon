icon-svg:
  version: VERSION
  neo: true
  css:
    component:
      src/css/icon-svg.css: {}
  js:
    src/js/icon-svg.ts: {}

# The sizing and baseline rules every inline SVG icon needs. A plain library,
# not a Neo build entry: it is attached by icon libraries rendering inline SVG
# and must work whether or not a site has compiled its assets.
icon-inline:
  version: VERSION
  css:
    component:
      css/icon-inline.css: {}

icon-browser:
  version: VERSION
  neo: true
  # css:
  #   component:
  #     src/css/icon-browser.scss: {}
  js:
    src/js/icon-browser.ts: {}
  dependencies:
    - core/once
    - core/drupal
    - neo_tooltip/tooltip

# Global SCSS includes.
# neo_icon.build.includes:
#   version: VERSION
#   dependencies: []
#   weight: -110
#   build_include:
#     - scss/globals
icon.include:
  version: VERSION
  dependencies: []
  neo:
    include:
      src/css/include/neo-icon.css: {}
