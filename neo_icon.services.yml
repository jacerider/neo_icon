services:
  plugin.manager.neo_icon:
    class: Drupal\neo_icon\IconManager
    arguments: ['@module_handler', '@theme_handler', '@cache.discovery']

  neo_icon.repository:
    class: Drupal\neo_icon\IconRepository
    arguments: ['@entity_type.manager', '@plugin.manager.neo_icon']

  # Holds what `neo_icon_entity()` used to do. The façade stays in the module
  # file — its signature is frozen and other packages call it — and delegates
  # here, so the bundle-label branch is reachable with a stub rather than a
  # booted site.
  neo_icon.element_factory:
    class: Drupal\neo_icon\IconElementFactory
    arguments: ['@entity_type.bundle.info']

  twig.neo_icon:
    class: 'Drupal\neo_icon\TwigExtension'
    tags:
      - { name: twig.extension }

  # neo_icon.neo_build_event_subscriber:
  #   class: '\Drupal\neo_icon\EventSubscriber\NeoBuildEventSubscriber'
  #   arguments: ['@entity_type.manager', '@file_system', '@file_url_generator']
  #   tags:
  #     - { name: 'event_subscriber' }

  neo_icon.neo_build_event_subscriber:
    class: '\Drupal\neo_icon\EventSubscriber\NeoBuildEventSubscriber'
    arguments: ['@entity_type.manager']
    tags:
      - { name: 'event_subscriber' }

  neo_icon.entity_type.manager:
    class: Drupal\neo_icon\IconEntityTypeManager
    arguments: ['@module_handler', '@cache.discovery']

  # The module's three behavioural hooks. Core would register the class itself,
  # autowired under its own name, because the container holds no definition for
  # it and its one collaborator is an aliased interface. It is written out all
  # the same: what a hook class is handed is worth reading in this file rather
  # than inferring from a type hint, and the package registers the rest of its
  # services here.
  Drupal\neo_icon\Hook\NeoIconHooks:
    class: Drupal\neo_icon\Hook\NeoIconHooks
    arguments: ['@entity_type.manager']

  # The module's theme registration, the four callbacks its theme hooks name as
  # their initial preprocess, and its four preprocess implementations against
  # other extensions' theme hooks. Written out for the same reason as the class
  # above, and because two of the three arguments are named services rather than
  # autowirable types: the icon repository turns a string icon id into an icon
  # in the two preprocessors every rendered icon passes through, the route match
  # is what the table and entity add list preprocessors used to reach through
  # `\Drupal::routeMatch()`, and the entity icon manager is what says whether an
  # entity type has icons at all.
  Drupal\neo_icon\Hook\NeoIconThemeHooks:
    class: Drupal\neo_icon\Hook\NeoIconThemeHooks
    arguments: ['@neo_icon.repository', '@current_route_match', '@neo_icon.entity_type.manager']
